<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Smart Parking System</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3.3 CSS Online CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.5.2 Online CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 60%, #312e81 100%);
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="login-box p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-logo-icon mx-auto mb-3" style="width: 60px; height: 60px; font-size: 28px;">
                <i class="fa-solid fa-square-parking"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">SMART PARKING</h4>
            <p class="text-muted small">Hệ Thống Quản Lý Bãi Xe Thông Minh</p>
        </div>

        <div id="alertBox" class="alert floating-alert d-none alert-dismissible fade show shadow-lg" role="alert">
            <div class="d-flex align-items-center">
                <i class="fa-solid fa-bell me-2 fs-5"></i>
                <span id="alertMessage" class="fw-semibold"></span>
            </div>
            <button type="button" class="btn-close" onclick="closeAlert()"></button>
        </div>

        <form onsubmit="handleFormLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" id="loginUsername" class="form-control" placeholder="Nhập tên đăng nhập..." required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Nhập mật khẩu..." required>
                </div>
            </div>

            <div id="loginErrorMsg" class="alert alert-danger d-none py-2 small rounded-3"></div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2.5 mb-3 shadow-sm rounded-3">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập
            </button>
        </form>

        <div class="border-top pt-3">
            <div class="text-muted small fw-semibold mb-2 text-center">Tài khoản demo kiểm thử nhanh:</div>
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-sm btn-outline-primary text-start rounded-3" onclick="quickLogin('admin', 'admin@123')">
                    <i class="fa-solid fa-user-shield me-2 text-danger"></i> <strong>Quản Lý Hệ Thống:</strong> <code>admin</code> / <code>admin@123</code>
                </button>
                <button type="button" class="btn btn-sm btn-outline-success text-start rounded-3" onclick="quickLogin('sgparking', '123456')">
                    <i class="fa-solid fa-building me-2 text-success"></i> <strong>Đơn Vị SG Parking:</strong> <code>sgparking</code> / <code>123456</code>
                </button>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="dashboard.html" class="text-decoration-none small text-muted">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang chủ xem thông tin
            </a>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/pages/login.js"></script>
</body>
</html>
